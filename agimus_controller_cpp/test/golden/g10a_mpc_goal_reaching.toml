[meta]
set = "G10a"
python_under_test = "agimus_controller.mpc.MPC.run with OCPCrocoGoalReaching and WarmStartShiftPreviousSolution"
agimus_controller_commit = "1ef2f86b9e04bf4b40eba9f3cc111da4d78fe3e1"
pinocchio = "4.1.0"
crocoddyl = "3.2.1"
mim_solvers = "0.3.0"
numpy = "2.5.2"
example_robot_data = "5.0.0"
python = "3.14.7"
generator = "agimus_controller_cpp/test/golden/generate_golden.py"
notes = [
    "No B1/B2 fix applied: the loop runs without them. The buffer holds n_ticks + n_controls points from the start, so the Python size check (B2) never fails, and factors = [1] makes it agree with horizon().",
    "Start-up (setup, before tick 0) mirrors the ROS node: set the references of the first horizon, WarmStartReference.generate from the initial state (a = 0), OCPBaseCroco.solve with use_iteration_limits_and_timeout=False (max 1000 iterations), then WarmStartShiftPreviousSolution.update_previous_solution. No clear_past.",
    "Each tick: MPC.run(state) (references, shift warm start, solve with solver_iters, update_previous_solution, clear_past); then the state is advanced with MPC.integrate(state, u0), u0 = us[0] of the solution (the feedback term is 0 since the state is x0): Euler step of ocp.problem.runningModels[0] (step timesteps[0] = dt) on [q, v].",
    "B1: Python's MPC.integrate adds int(dt * 1e-9) = 0 to time_ns, so ticks.time_ns stays 0. C++ adds dt (10 ms). Time does not influence the solve (MPC.run ignores current_time_ns, audit A3).",
    "A12 does not apply: timesteps[0] == dt (the shift warm start requires it).",
    "A13 does not apply: every factor is 1.",
    "Aliasing fix in the script: MPC.integrate returns views of runningDatas[0].xnext; q and v are copied right after integrate, otherwise the next solve would overwrite the state before it is integrated.",
]

